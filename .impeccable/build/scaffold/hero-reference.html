<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Scaffold reference: variation-1.png</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Akt:wght@700&family=Chivo+Mono:wght@700&display=swap">
  <link rel="stylesheet" href="layout.css">
  <style>html,body{margin:0}body{background:#f8f8f8}.region{box-sizing:border-box}.region.text p{white-space:pre-wrap}</style>
</head>
<body>
<!-- Reference only. Every region sits at its measured box inside a comp-aspect frame. Take the boxes (layout.css), keep your own semantic structure. -->
<main class="comp-frame" style="max-width:1672px">
  <div class="r-wordmark region text" data-region="wordmark"><!-- small uppercase LABON at top left --><p style="font-size:var(--r-wordmark-font);line-height:1.05;margin:0">wordmark</p></div>
  <div class="r-accent-rule region chrome" data-region="accent-rule"><!-- thin vertical forest green rule at left --></div>
  <div class="r-headline region text" data-region="headline"><!-- enormous charcoal bold two-line headline --><p style="font-size:var(--r-headline-font);font-family:var(--r-headline-family),sans-serif;font-weight:var(--r-headline-weight);line-height:1.05;margin:0">headline</p></div>
  <div class="r-metric-one-value region text" data-region="metric-one-value"><!-- large green 63 --><p style="line-height:1.05;margin:0">metric-one-value</p></div>
  <div class="r-metric-one-label region text" data-region="metric-one-label"><!-- surfaces label --><p style="font-size:var(--r-metric-one-label-font);line-height:1.05;margin:0">metric-one-label</p></div>
  <div class="r-metric-two-value region text" data-region="metric-two-value"><!-- large green 235 --><p style="font-size:var(--r-metric-two-value-font);font-family:var(--r-metric-two-value-family),sans-serif;font-weight:var(--r-metric-two-value-weight);line-height:1.05;margin:0">metric-two-value</p></div>
  <div class="r-metric-two-label region text" data-region="metric-two-label"><!-- end to end tests label --><p style="font-size:var(--r-metric-two-label-font);line-height:1.05;margin:0">metric-two-label</p></div>
  <div class="r-metric-three-value region text" data-region="metric-three-value"><!-- large green 25 --><p style="line-height:1.05;margin:0">metric-three-value</p></div>
  <div class="r-metric-three-label region text" data-region="metric-three-label"><!-- threats label --><p style="font-size:var(--r-metric-three-label-font);line-height:1.05;margin:0">metric-three-label</p></div>
  <div class="r-metric-dividers region chrome" data-region="metric-dividers"><!-- two slender gray vertical dividers between metrics --></div>
  <div class="r-date region text" data-region="date"><!-- small gray date at bottom left --><p style="font-size:var(--r-date-font);line-height:1.05;margin:0">date</p></div>
  <div class="r-navigation region control" data-region="navigation"><!-- small previous/next chevrons and slide index at bottom right: rebuild the control's chrome from the crop (comp-spec.mjs --crop navigation); its ink box, border, fill, radius, and label size are the comp's --></div>
</main>
</body>
</html>
